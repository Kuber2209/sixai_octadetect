<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFID Inventory — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form id="login-form" class="login-card">
    <h1>RFID Inventory</h1>
    <p class="muted">In-house inventory portal</p>
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" hidden>Invalid username or password</p>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: form.get('username'), password: form.get('password')}),
      });
      if (res.ok) { location.href = '/'; }
      else { document.getElementById('login-error').hidden = false; }
    });
  </script>
</body>
</html>
